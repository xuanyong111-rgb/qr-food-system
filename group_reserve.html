<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>团餐预订通道</title>
    <link rel="stylesheet" href="style.css">
    <script src="shops.js"></script>
    <style>
        .admin-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .admin-box {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            width: 85%;
            max-width: 350px;
            text-align: center;
        }

        .admin-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .admin-box button {
            width: 100%;
            background: #8B5A2B;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
            font-size: 15px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #FAF6F0;
            padding: 15px;
            color: #4A3E3D;
            margin: 0;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        /* 顶部标题区 */
        .page-header {
            text-align: center;
            margin-bottom: 20px;
            padding-top: 10px;
        }

        .page-header h2 {
            color: #8B5A2B;
            margin: 0 0 5px 0;
            font-size: 24px;
            font-weight: 800;
        }

        .page-header p {
            color: #A08875;
            font-size: 13px;
            margin: 0;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* 卡片容器优化：自适应屏幕且不会越界 */
        .form-card {
            background: #FFF;
            border-radius: 16px;
            padding: 16px; /* 缩减边距，释放屏幕空间 */
            box-shadow: 0 4px 20px rgba(139, 90, 43, 0.06);
            margin-bottom: 20px;
            border: 1px solid #FDF5ED;
            width: 100%;
            overflow: hidden; 
        }

        .section-title {
            font-size: 16px;
            color: #8B5A2B;
            border-left: 4px solid #CD853F;
            padding-left: 10px;
            margin: 0 0 15px 0;
            font-weight: bold;
        }

        /* 🌟 双列网格卡片菜单 */
        .showcase-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        /* 隐藏原生单选框/多选框 */
        .meal-card-label { display: block; height: 100%; cursor: pointer; user-select: none; }
        .meal-card-label input[type="radio"],
        .meal-card-label input[type="checkbox"] { display: none; }
        
        .showcase-item {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(139, 90, 43, 0.04);
            padding: 12px; /* 缩减卡片内留白 */
            text-align: left;
            border: 2px solid #FDF5ED;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        /* 标题排版：加入强制断行，防止长英文/长标题撑爆卡片 */
        .showcase-title {
            font-size: 14px; /* 字体精致化 */
            font-weight: 800;
            color: #4A3E3D;
            margin-bottom: 6px;
            line-height: 1.35;
            padding-right: 22px;
            word-break: break-word; 
            overflow-wrap: anywhere; 
        }

        .showcase-price {
            font-size: 15px;
            font-weight: 900;
            color: #D2691E;
            margin-bottom: 8px;
        }

        /* 描述排版：两端对齐，看起来更像专业的业务说明 */
        .showcase-desc {
            font-size: 12px;
            color: #8d6e63;
            line-height: 1.4;
            flex: 1;
            word-break: break-word;
            text-align: justify; 
        }

        .showcase-item img {
            width: 100%;
            height: 130px;
            object-fit: cover;
        }

        /* 被选中的卡片状态 (亮起烘焙橙色边框) */
        .meal-card-label input[type="checkbox"]:checked + .showcase-item {
            border-color: #D2691E;
            background: #FFFDF9;
            box-shadow: 0 6px 16px rgba(210, 105, 30, 0.12);
            transform: translateY(-2px);
        }

        .check-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #EFE2D5;
            color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .meal-card-label input[type="checkbox"]:checked + .showcase-item .check-icon {
            background: #D2691E;
            color: white;
            transform: scale(1.1);
        }

        .showcase-title {
            font-size: 16px;
            font-weight: 800;
            color: #4A3E3D;
            margin-bottom: 8px;
            line-height: 1.3;
            padding-right: 30px;
        }

        .showcase-price {
            font-size: 18px;
            font-weight: 900;
            color: #D2691E;
            margin-bottom: 10px;
        }

        .showcase-desc {
            font-size: 13px;
            color: #8d6e63;
            line-height: 1.5;
            flex: 1;
        }

        /* 🌟 核心逻辑：表单隐藏与丝滑弹出动画 */
        #order-form-section {
            display: none;
            /* 初始隐藏 */
            animation: slideDownFadeIn 0.5s ease-out forwards;
        }

        @keyframes slideDownFadeIn {
            0% {
                opacity: 0;
                transform: translateY(-20px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 底部表单输入框优化 */
        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            font-weight: bold;
            font-size: 13px;
            color: #633E1A;
            display: block;
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #EFE2D5;
            border-radius: 10px;
            box-sizing: border-box;
            background: #FFFBF7;
            color: #4A3E3D;
            font-weight: bold;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .input-group input:focus {
            border-color: #8B5A2B;
            background: #FFF;
            box-shadow: 0 0 0 3px rgba(139, 90, 43, 0.1);
        }

        /* 提交大按钮 */
        .submit-btn {
            width: 100%;
            background: #25D366;
            color: #FFF;
            border: none;
            padding: 15px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:active {
            transform: scale(0.96);
        }

        input[type="text"],
        input[type="number"],
        textarea {
            -webkit-touch-callout: text !important;
            -webkit-user-select: text !important;
            user-select: text !important;
            pointer-events: auto !important;
        }
    </style>
</head>

<body>

    <div class="page-header">
        <img id="merchant-logo" src="" alt="商户招牌"
            style="display: none; height: 75px; width: 75px; object-fit: cover; border-radius: 50%; margin: 0 auto 12px auto; box-shadow: 0 4px 12px rgba(139,90,43,0.15);">
        <h2 id="merchant-title">🍽️ 团餐专属预订</h2>
        <p id="merchant-slogan">每日鲜做 · 批量特惠 · 极速核单</p>
    </div>

    <div class="form-card">
        <h3 class="section-title">🔥 1. 选择今日套餐 (点击选择)</h3>
        <div class="showcase-grid" id="dynamic-menu-container">
            <div style="grid-column: span 2; text-align: center; padding: 30px; color: #A08875; font-weight: bold;">
                🔄 正在获取今日新鲜菜单...
            </div>
        </div>
    </div>

    <div class="form-card" id="order-form-section">
        <h3 class="section-title">📝 2. 填写预订信息</h3>
        <div id="dynamic-form-container">
            <div style="text-align:center; font-size:13px; color:#A08875;">⏳ 正在加载表单配置...</div>
        </div>
        <button class="submit-btn" onclick="executeGroupMealLock()">
            <span>🔒 生成防伪暗号并发送</span>
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"
                style="width: 20px; height: 20px;" alt="WA">
        </button>
    </div>

    <div class="admin-modal" id="admin-modal">
        <div class="admin-box">
            <h3>管理员登录</h3>
            <input type="password" id="admin-password" placeholder="请输入管理员密码" autocomplete="off">
            <button onclick="loginAdmin()">登录</button>
        </div>
    </div>

    <script>
        const dbUrl = "https://qr-foor-orders-default-rtdb.asia-southeast1.firebasedatabase.app";
        const urlParams = new URLSearchParams(window.location.search);

        let shopId = urlParams.get('shop');
        if (!shopId) {
            shopId = localStorage.getItem('qr_food_remember_shop') || 'wuwangxin_a';
        }

        // 🚨 核心修改：把 const 改成 let，允许下方代码动态替换它；这里的号码仅作兜底
        let merchantPhone = "60173716837";

        // 自动分配的高级美食占位图
        const defaultImages = [
            "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=60",
            "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=60",
            "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=60",
            "https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=60"
        ];

        window.onload = async function () {
            const shopConfig = typeof allShopsData !== 'undefined' ? allShopsData[shopId] : null;
            if (shopConfig) {
                if (shopConfig.logoUrl) {
                    const logoImg = document.getElementById('merchant-logo');
                    logoImg.src = shopConfig.logoUrl;
                    logoImg.style.display = 'block';
                }
                if (shopConfig.shopName) {
                    document.getElementById('merchant-title').innerText = `${shopConfig.shopName} · 预订`;
                    document.title = `${shopConfig.shopName} | 预订`;
                }
                if (shopConfig.slogan) {
                    document.getElementById('merchant-slogan').innerText = shopConfig.slogan;
                }

                // 🌟 核心接入：从 shops.js 抓取当前商家的专属号码并覆盖
                if (shopConfig.merchantPhone) {
                    merchantPhone = shopConfig.merchantPhone;
                }
            }

            // 🌟 核心新增：动态获取商家表单配置并渲染，自动为回头客填充历史信息
            try {
                const fieldRes = await fetch(`${dbUrl}/menu_config/${shopId}/form_fields.json`);
                let formFields = null;
                if (fieldRes.ok) formFields = await fieldRes.json();

                if (!formFields || !Array.isArray(formFields) || formFields.length === 0) {
                    formFields = shopConfig && shopConfig.customFormFields ? shopConfig.customFormFields : [
                        { label: "👤 联系人姓名", placeholder: "请输入您的称呼" },
                        { label: "📍 配送地址 (若自取请填'自取')", placeholder: "请输入完整配送地址" }
                    ];
                }

                let formHtml = "";
                const savedInfo = JSON.parse(localStorage.getItem('gm_saved_dynamic_info') || '{}');

                formFields.forEach(f => {
                    const savedValue = savedInfo[f.label] || '';
                    formHtml += `
            <div class="input-group">
                <label>${f.label}</label>
                <input type="text" class="dynamic-customer-input" data-label="${f.label}" value="${savedValue}" placeholder="${f.placeholder}" autocomplete="off">
            </div>`;
                });

                const formContainer = document.getElementById('dynamic-form-container');
                if (formContainer) formContainer.innerHTML = formHtml;
            } catch (err) {
                console.error("表单字段加载失败", err);
            }

            try {
                const res = await fetch(`${dbUrl}/menu_config/${shopId}/group_menu.json`);
                let menuItems = null;

                // 只有在网络请求成功的情况下，才去解析数据
                if (res.ok) {
                    menuItems = await res.json();
                }

                const container = document.getElementById('dynamic-menu-container');

                // 💡 核心修复：严密判断！如果拿到的不是列表（比如是 null 或是错误信息），立刻启用高颜值兜底数据！
                if (!menuItems || !Array.isArray(menuItems) || menuItems.length === 0) {
                    console.warn("未获取到云端菜单，启用默认展示模板");
                    menuItems = [
                        "A套餐：招牌咖喱鸡 + 黄金炸蛋 + 香米饭",
                        "B套餐：经典黑椒鸡扒 + 意面 + 沙拉",
                        "C套餐：手作卤肉饭 + 卤豆腐 + 时蔬",
                        "D套餐：法式奶油蘑菇鸡 + 烤面包"
                    ];
                }

                let html = "";
                menuItems.forEach((item, index) => {
                    const mealName = typeof item === 'string' ? item : (item.name || "未命名套餐");
                    const price = item.price ? `RM ${parseFloat(item.price).toFixed(2)}` : '';
                    const desc = item.desc || '暂无详细描述';

                    // 🌟 核心新增：在卡片内嵌入独立数量选择器组件
                    html += `
                <label class="meal-card-label">
                    <input type="checkbox" name="meal_choice" value="${mealName}" onchange="toggleMealQty(this); revealForm();">
                    <div class="showcase-item">
                        <div class="check-icon">✓</div>
                        <div class="showcase-title">${mealName}</div>
                        <div class="showcase-price">${price}</div>
                        <div class="showcase-desc">${desc}</div>
                        <div class="qty-counter-box" onclick="event.stopPropagation(); event.preventDefault();" style="margin-top: 12px; display: none; align-items: center; gap: 10px; background: #FFFBF7; padding: 6px 10px; border-radius: 20px; border: 1px solid #EFE2D5; width: max-content;">
                            <button type="button" onclick="adjustItemQty(this, -1)" style="width:24px; height:24px; border:1px solid #d7ccc8; border-radius:50%; background:#fff; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#8B5A2B;">-</button>
                            <input type="number" class="meal-item-qty" value="1" min="1" readonly style="width: 35px; text-align: center; font-weight: bold; border: none; background: transparent; color: #4A3E3D; font-size: 14px;">
                            <button type="button" onclick="adjustItemQty(this, 1)" style="width:24px; height:24px; border:1px solid #d7ccc8; border-radius:50%; background:#fff; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#8B5A2B;">+</button>
                        </div>
                    </div>
                </label>
            `;
                });
                container.innerHTML = html;
            } catch (err) {
                console.error(err);
            }
        };

        // 🌟 核心新增：数量控件交互辅助函数
        function toggleMealQty(chk) {
            const counterBox = chk.closest('.meal-card-label').querySelector('.qty-counter-box');
            if (chk.checked) {
                counterBox.style.display = 'flex';
                counterBox.querySelector('.meal-item-qty').value = 1;
            } else {
                counterBox.style.display = 'none';
                counterBox.querySelector('.meal-item-qty').value = 0;
            }
        }

        function adjustItemQty(btn, amount) {
            const input = btn.closest('.qty-counter-box').querySelector('.meal-item-qty');
            let currentVal = parseInt(input.value) || 1;
            currentVal += amount;
            if (currentVal < 1) currentVal = 1;
            input.value = currentVal;
        }

        // 🌟 用户点击商品卡片后，弹出表单区块
        function revealForm() {
            const checkedMeals = document.querySelectorAll('input[name="meal_choice"]:checked');
            const form = document.getElementById('order-form-section');
            
            if (checkedMeals.length > 0) {
                const isJustOpened = form.style.display !== 'block';
                form.style.display = 'block';
                
                if (isJustOpened) {
                    setTimeout(() => {
                        form.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }, 200);
                }
            } else {
                form.style.display = 'none';
            }
        }

        async function executeGroupMealLock() {
            const selectedMeals = document.querySelectorAll('input[name="meal_choice"]:checked');
            const inputs = document.querySelectorAll('.dynamic-customer-input');

            let isFormComplete = true;
            let customerDataStrArr = [];
            let waCustomerInfo = "";
            let savedInfo = {};

            inputs.forEach(input => {
                const val = input.value.trim();
                if (!val) isFormComplete = false;
                waCustomerInfo += `${input.dataset.label}：${val}\n`;
                customerDataStrArr.push(`${input.dataset.label}: ${val}`);
                savedInfo[input.dataset.label] = val;
            });

            if (selectedMeals.length === 0 || !isFormComplete) return alert("⚠️ 请完整选择套餐并填写所有预订信息！");

            localStorage.setItem('gm_saved_dynamic_info', JSON.stringify(savedInfo));

            const randomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
            const secureCode = `GM-${randomCode}`;
            const orderId = `GRP_${Date.now()}`;

            let detailSegments = [];
            selectedMeals.forEach(el => {
                const labelContainer = el.closest('.meal-card-label');
                const qty = labelContainer.querySelector('.meal-item-qty').value;
                detailSegments.push(`${el.value} x ${qty}`);
            });
            const fullDetails = detailSegments.join(', ');

            const payload = {
                shopId: shopId,
                customerName: inputs.length > 0 ? inputs[0].value.trim() : "顾客", // 兼容旧系统的兜底
                customerDataStr: customerDataStrArr.join(' | '), // 新版看板依赖此字段
                details: fullDetails,
                secureCode: secureCode,
                status: "pending_wa",
                timestamp: new Date().toISOString()
            };

            try {
                // 将原先直连 Firebase 的请求，替换为调用新建的 Netlify 云函数
                const response = await fetch('/.netlify/functions/submitGroupOrder', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.success) {
                    const waMessage = `🌟 * 订单/预订确认 * 🌟\n\n${waCustomerInfo}📦 内容：${fullDetails}\n🔑 *防伪暗号：${secureCode}*\n\n---\n⚠️ 商家提示：取餐/收货时必须核对上述暗号，系统对账以此暗号为准。`;
                    window.location.href = `https://wa.me/${merchantPhone}?text=${encodeURIComponent(waMessage)}`;
                } else {
                    alert("❌ 预订失败：" + result.error);
                }
            } catch (err) {
                alert("🚀 云端通信失败，请检查网络！");
            }
        }
    </script>
</body>

</html>
